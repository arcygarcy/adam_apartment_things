<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Light Controller</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --win-teal: #008080;
            --win-gray: #c0c0c0;
            --win-dark: #808080;
            --win-darker: #0a0a0a;
            --win-light: #dfdfdf;
            --win-white: #ffffff;
            --win-navy: #000080;
            --win-blue: #1084d0;
            --win-text: #000000;
            --bevel-raised: inset -1px -1px #0a0a0a, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
            --bevel-sunken: inset -1px -1px #ffffff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a;
            --bevel-pressed: inset 1px 1px #0a0a0a, inset -1px -1px #ffffff, inset 2px 2px #808080, inset -2px -2px #dfdfdf;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Tahoma", "MS Sans Serif", "Segoe UI", Geneva, sans-serif;
            font-size: 12px;
            background-color: var(--win-teal);
            color: var(--win-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .window {
            width: 100%;
            max-width: 390px;
            background: var(--win-gray);
            box-shadow: var(--bevel-raised), 4px 4px 0px rgba(0, 0, 0, 0.35);
            padding: 3px;
            user-select: none;
        }

        .title-bar {
            background: linear-gradient(90deg, var(--win-navy), var(--win-blue));
            padding: 3px 4px 3px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--win-white);
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.2px;
        }

        .title-bar-text {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .title-btn {
            width: 16px;
            height: 14px;
            background: var(--win-gray);
            box-shadow: var(--bevel-raised);
            border: none;
            color: var(--win-text);
            font-family: "Tahoma", sans-serif;
            font-size: 9px;
            font-weight: bold;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            padding: 0;
        }

        .title-btn:active {
            box-shadow: var(--bevel-pressed);
            padding-top: 1px;
            padding-left: 1px;
        }

        .menu-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 6px;
            border-bottom: 1px solid var(--win-dark);
            box-shadow: 0 1px 0 var(--win-white);
            margin-bottom: 6px;
        }

        .hub-link {
            color: var(--win-text);
            text-decoration: none;
            font-size: 11px;
            padding: 2px 6px;
            background: var(--win-gray);
            box-shadow: var(--bevel-raised);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .hub-link:active {
            box-shadow: var(--bevel-pressed);
            transform: translate(1px, 1px);
        }

        .window-body {
            padding: 8px 10px 6px;
        }

        /* Sunken monitor display for room light state */
        .monitor-well {
            background: #000000;
            box-shadow: var(--bevel-sunken);
            padding: 14px 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .status-ring {
            width: 22px;
            height: 22px;
            background: #3a1010;
            box-shadow: var(--bevel-sunken);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-ring.on {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00, inset 2px 2px 4px #ffffff;
        }

        #status-text {
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            color: #808080;
            letter-spacing: 1px;
        }

        fieldset {
            border: none;
            box-shadow: inset 1px 1px var(--win-dark), inset -1px -1px var(--win-white), 1px 1px var(--win-white), -1px -1px var(--win-dark);
            padding: 10px 10px 10px;
            margin: 0 0 12px 0;
        }

        legend {
            padding: 0 5px;
            font-size: 11px;
            color: var(--win-text);
            margin-left: 4px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            padding: 9px 10px;
            border: none;
            background: var(--win-gray);
            color: var(--win-text);
            box-shadow: var(--bevel-raised);
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn:active {
            box-shadow: var(--bevel-pressed);
            padding: 10px 9px 8px 11px;
        }

        .btn-primary {
            outline: 1px solid #000000;
            outline-offset: -1px;
        }

        .brightness-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .btn-level {
            padding: 8px 0;
            border: none;
            background: var(--win-gray);
            color: var(--win-text);
            box-shadow: var(--bevel-raised);
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-level:active {
            box-shadow: var(--bevel-pressed);
        }

        .btn-level.active {
            box-shadow: var(--bevel-pressed);
            background-color: #dfdfdf;
            background-image: linear-gradient(45deg, #c0c0c0 25%, transparent 25%, transparent 75%, #c0c0c0 75%, #c0c0c0),
                              linear-gradient(45deg, #c0c0c0 25%, transparent 25%, transparent 75%, #c0c0c0 75%, #c0c0c0);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            color: var(--win-navy);
            outline: 1px dotted #000000;
            outline-offset: -4px;
        }

        .color-presets {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            background: var(--win-gray);
            padding: 2px;
        }

        .swatch {
            width: 100%;
            aspect-ratio: 1;
            border: none;
            box-shadow: var(--bevel-sunken);
            cursor: pointer;
            box-sizing: border-box;
            position: relative;
        }

        .swatch.selected {
            outline: 2px solid #000000;
            outline-offset: 1px;
            box-shadow: inset 0 0 0 2px #ffffff, var(--bevel-sunken);
        }

        .swatch-custom {
            background: conic-gradient(from 0deg, red, yellow, lime, aqua, blue, magenta, red);
            overflow: hidden;
        }

        .swatch-custom input[type="color"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            border: none;
            padding: 0;
            margin: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .status-bar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 3px;
            margin-top: 4px;
            padding: 2px 2px 1px;
        }

        .status-bar-field {
            box-shadow: inset -1px -1px #dfdfdf, inset 1px 1px #808080;
            padding: 3px 6px;
            font-size: 11px;
            color: var(--win-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <div class="title-bar-text">
            <img src="favicon.png" width="16" height="16" style="image-rendering: pixelated; display: block;" alt="">
            <span>lights.exe - Room Light Controller</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn" type="button" aria-label="Minimize">_</button>
            <button class="title-btn" type="button" aria-label="Maximize">□</button>
            <a href="../" class="title-btn" title="Back to Hub" aria-label="Close">✕</a>
        </div>
    </div>

    <div class="menu-bar">
        <a href="../" class="hub-link">&larr; Back to Hub</a>
        <span style="color: #404040; font-size: 11px;">Tuya Local Control v3.5</span>
    </div>

    <div class="window-body">
        <div class="monitor-well">
            <div id="status-ring" class="status-ring"></div>
            <div id="status-text">SYSTEM STANDBY (OFF)</div>
        </div>

        <fieldset>
            <legend>Power &amp; Mode</legend>
            <div class="controls-grid">
                <button class="btn btn-primary" onclick="sendCommand('on')">Turn ON</button>
                <button class="btn btn-secondary" onclick="sendCommand('off')">Turn OFF</button>
                <button class="btn btn-secondary" style="grid-column: span 2;" onclick="sendCommand('reset')">Reset to Daylight</button>
            </div>
        </fieldset>

        <fieldset>
            <legend>Brightness (Dims Current Color)</legend>
            <div class="brightness-grid">
                <button type="button" class="btn-level" data-level="10" onclick="setBrightness(10)">10%</button>
                <button type="button" class="btn-level" data-level="33" onclick="setBrightness(33)">33%</button>
                <button type="button" class="btn-level" data-level="66" onclick="setBrightness(66)">66%</button>
                <button type="button" class="btn-level active" data-level="100" onclick="setBrightness(100)">100%</button>
            </div>
        </fieldset>

        <fieldset style="margin-bottom: 6px;">
            <legend>Color Palette (Tap to Apply)</legend>
            <div class="color-presets">
                <div class="swatch" style="background: #ff0000" onclick="selectColor('#ff0000', this)" title="Red"></div>
                <div class="swatch" style="background: #ffa500" onclick="selectColor('#ffa500', this)" title="Orange"></div>
                <div class="swatch" style="background: #ffff00" onclick="selectColor('#ffff00', this)" title="Yellow"></div>
                <div class="swatch" style="background: #00ff00" onclick="selectColor('#00ff00', this)" title="Green"></div>
                <div class="swatch" style="background: #00ffff" onclick="selectColor('#00ffff', this)" title="Cyan"></div>
                <div class="swatch" style="background: #0000ff" onclick="selectColor('#0000ff', this)" title="Blue"></div>
                <div class="swatch" style="background: #ff00ff" onclick="selectColor('#ff00ff', this)" title="Magenta"></div>
                <div id="custom-swatch" class="swatch swatch-custom" title="Custom Color...">
                    <input type="color" id="custom-color" value="#ff8800">
                </div>
            </div>
        </fieldset>
    </div>

    <div class="status-bar">
        <div class="status-bar-field">3 Candle Bulbs</div>
        <div id="broker-status" class="status-bar-field">CONNECTING...</div>
    </div>
</div>

<script>
    const TOPIC_CMD = "adam/lights/candle_controller/cmd";
    const TOPIC_STATUS = "adam/lights/candle_controller/status";
    const BROKER = "wss://broker.hivemq.com:8884/mqtt"; 

    let currentBrightness = 100;
    let hasSyncedInitialBrightness = false;
    let customColorDebounce = null;
    let lastSentCustomColor = null;

    const client = mqtt.connect(BROKER);
    
    const ring = document.getElementById('status-ring');
    const statusText = document.getElementById('status-text');
    const brokerStatus = document.getElementById('broker-status');
    const customColorInput = document.getElementById('custom-color');
    const customSwatch = document.getElementById('custom-swatch');
    const levelButtons = document.querySelectorAll('.btn-level');

    function highlightClosestLevel(val) {
        const levels = [10, 33, 66, 100];
        let closest = 100;
        let minDiff = Infinity;
        for (const lvl of levels) {
            const diff = Math.abs(val - lvl);
            if (diff < minDiff) {
                minDiff = diff;
                closest = lvl;
            }
        }
        currentBrightness = closest;
        levelButtons.forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.getAttribute('data-level'), 10) === closest);
        });
    }

    function setBrightness(level) {
        currentBrightness = level;
        levelButtons.forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.getAttribute('data-level'), 10) === level);
        });
        // Dims/brightens whatever color the lights currently are
        client.publish(TOPIC_CMD, JSON.stringify({
            target: "all",
            action: "apply",
            brightness: level
        }));
    }

    function selectColor(hex, element) {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        if (element) element.classList.add('selected');
        client.publish(TOPIC_CMD, JSON.stringify({
            target: "all",
            action: "apply",
            color: hex,
            brightness: currentBrightness
        }));
    }

    function handleCustomColorInput(e) {
        const hex = e.target.value;
        if (!hex) return;
        customSwatch.style.background = `radial-gradient(circle, ${hex} 42%, transparent 46%), conic-gradient(from 0deg, red, yellow, lime, aqua, blue, magenta, red)`;
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        customSwatch.classList.add('selected');

        if (customColorDebounce) clearTimeout(customColorDebounce);
        customColorDebounce = setTimeout(() => {
            lastSentCustomColor = hex;
            selectColor(hex, customSwatch);
        }, 250);
    }

    customColorInput.addEventListener('input', handleCustomColorInput);
    customColorInput.addEventListener('change', (e) => {
        const hex = e.target.value;
        if (!hex) return;
        if (customColorDebounce) clearTimeout(customColorDebounce);
        if (lastSentCustomColor !== hex) {
            lastSentCustomColor = hex;
            selectColor(hex, customSwatch);
        }
    });

    client.on('connect', () => {
        brokerStatus.innerText = "MQTT: ONLINE";
        brokerStatus.style.color = "#006400";
        client.subscribe(TOPIC_STATUS);
        client.publish(TOPIC_CMD, JSON.stringify({ action: "status" }));
    });

    client.on('message', (topic, message) => {
        if (topic === TOPIC_STATUS) {
            const data = JSON.parse(message.toString());
            if (data.room_state === 'on') {
                ring.classList.add('on');
                statusText.innerText = "LIGHTS: ON";
                statusText.style.color = "#00ff00";
            } else {
                ring.classList.remove('on');
                statusText.innerText = "LIGHTS: OFF";
                statusText.style.color = "#808080";
            }

            if (!hasSyncedInitialBrightness && Array.isArray(data.devices) && data.devices.length > 0) {
                const b = parseInt(data.devices[0].brightness, 10);
                if (!isNaN(b) && b >= 1 && b <= 100) {
                    hasSyncedInitialBrightness = true;
                    highlightClosestLevel(b);
                }
            }
        }
    });

    function sendCommand(action) {
        if (action === 'reset') {
            highlightClosestLevel(100);
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        }
        client.publish(TOPIC_CMD, JSON.stringify({ target: "all", action: action }));
    }
</script>

</body>
</html>
